  meaning: Too Many Requests — concurrency ceiling for the API or the account was exceeded.
  body: JSON object with a `message` field.
  remediation: >-
    Wait for in-flight jobs or connections to complete; Symbl directs accounts needing more
    concurrency to support@symbl.ai.
