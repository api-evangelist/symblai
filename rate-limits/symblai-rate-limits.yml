notes: >-
  Symbl.ai governed load by CONCURRENCY, not by requests-per-window: a plan buys a number of
  simultaneous Streaming connections and simultaneous Async jobs, and exceeding it returns 429.
  The per-tier concurrency ceilings are still published on the live pricing page today; the
  per-API concurrency, payload and object ceilings come from the open-sourced docs. NO RUNTIME
  RATE-LIMIT HEADERS were ever documented — no X-RateLimit-*, no RateLimit-*, no Retry-After —
  so a client could not read remaining budget or a back-off hint from a response and had to
  count its own in-flight work. That gap is the finding. All endpoints described here sit on
  api.symbl.ai, which no longer resolves (see lifecycle/symblai-lifecycle.yml).
