name: Symbl.ai
description: >-
  Symbl.ai is a conversation-intelligence platform for understanding and
  generating insights from human conversations across voice, video, and text.
  Its developer platform exposed Async, Streaming, and Telephony APIs plus the
  Nebula LLM for real-time speech-to-text and conversational insights — action
  items, topics, questions, follow-ups, sentiment, and custom trackers — with
  first-party SDKs for JavaScript, Web (browser), Python, and Go. Symbl.ai was
  acquired by Invoca (announced 2025-05-28) and the standalone developer platform
  is decommissioned: api.symbl.ai, docs.symbl.ai, platform.symbl.ai,
  nebula.symbl.ai and integrations.symbl.ai all fail to resolve in DNS as of
  2026-08-14, so no endpoint is callable and no account can be created. What
  survives is real and public — the open-sourced documentation repository
  (github.com/symblai/symbl-docs), first-party Postman workspaces, the client
  SDKs on npm, PyPI and pkg.go.dev (newest release 2024-11-18), and the live
  marketing, blog, pricing and SOC 2 / HIPAA / PCI / GDPR compliance pages.
